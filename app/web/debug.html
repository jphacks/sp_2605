<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>受信確認</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 16px; background: #fafafa; color: #222; }
  #state { font-size: 48px; font-weight: bold; }
  .exhale { color: #1a7f37; } .inhale { color: #0969da; } .idle { color: #888; }
  canvas { background: #fff; border: 1px solid #ddd; width: 100%; height: 240px; }
  pre { background: #fff; border: 1px solid #ddd; padding: 8px; height: 200px; overflow: auto; font-size: 12px; }
  .holes span { display: inline-block; width: 32px; height: 32px; border-radius: 50%; border: 2px solid #555; margin-right: 6px; }
  .holes span.on { background: #f0a000; }
</style>
</head>
<body>
<h1>受信確認</h1>
<div id="status">接続中…</div>
<div id="state" class="idle">idle</div>
<div>変化 <b id="delta">-</b> Pa ／ 強さ <b id="strength">-</b> ／ 気圧 <span id="pa">-</span> Pa</div>
<div class="holes" id="holes">指穴（キーボード 1〜4 でも代用可）：<span></span><span></span><span></span><span></span></div>
<canvas id="graph" width="1000" height="240"></canvas>
<pre id="log"></pre>
<script>
const $ = (id) => document.getElementById(id);
const points = [];
const ws = new WebSocket(`ws://${location.host}/ws`);
ws.onopen = () => ($("status").textContent = "接続しました");
ws.onclose = () => ($("status").textContent = "切断されました（サーバーを確認）");
ws.onmessage = (e) => {
  const m = JSON.parse(e.data);
  if (m.type === "breath") {
    $("state").textContent = m.state;
    $("state").className = m.state;
    $("delta").textContent = m.delta;
    $("strength").textContent = m.strength;
    $("pa").textContent = m.pa;
    points.push(m.delta);
    if (points.length > 300) points.shift();
    draw();
  } else if (m.type === "touch") {
    [...$("holes").querySelectorAll("span")].forEach((s, i) => s.classList.toggle("on", !!m.holes[i]));
  } else {
    $("log").textContent = JSON.stringify(m) + "\n" + $("log").textContent;
    if (m.type === "status") $("status").textContent = `DPS368: ${m.dps ? "OK" : "未接続"} ／ タッチ: ${m.touch ? "OK" : "未接続"}${m.mock ? "（疑似データ）" : ""}`;
  }
};
function draw() {
  const c = $("graph"), g = c.getContext("2d");
  g.clearRect(0, 0, c.width, c.height);
  const zero = c.height * 0.8, scale = c.height * 0.75 / 350;
  g.strokeStyle = "#ccc"; g.beginPath(); g.moveTo(0, zero); g.lineTo(c.width, zero); g.stroke();
  g.strokeStyle = "#1a7f37"; g.lineWidth = 2; g.beginPath();
  points.forEach((d, i) => { const x = i * c.width / 300, y = zero - d * scale; i ? g.lineTo(x, y) : g.moveTo(x, y); });
  g.stroke();
}
const keys = [0, 0, 0, 0];
const sendKeys = () => ws.readyState === 1 && ws.send(JSON.stringify({ type: "touch_key", holes: keys }));
addEventListener("keydown", (e) => { const i = "1234".indexOf(e.key); if (i >= 0 && !keys[i]) { keys[i] = 1; sendKeys(); } });
addEventListener("keyup", (e) => { const i = "1234".indexOf(e.key); if (i >= 0) { keys[i] = 0; sendKeys(); } });
</script>
</body>
</html>
