<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>呼吸の波</title>
<!-- 呼吸の大きさ（基準からの気圧の変化）をリアルタイムで波として表示する。ゲームとは別のページで、受け取って表示するだけ -->
<style>
  :root { --bg: #0d1430; --panel: #151e45; --ink: #ffffff; --sub: #b9c3e6; --exhale: #5cc2b3; --inhale: #6cb6ff; --idle: #7d86a8; --line: #2c355a; --gold: #ffd166; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink); font-family: "Noto Sans JP", system-ui, sans-serif; display: flex; flex-direction: column; padding: 16px 24px; gap: 12px; }
  header { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 28px; }
  h1 small { color: var(--gold); font-size: 18px; margin-left: 8px; }
  #status { color: var(--sub); font-size: 16px; margin-left: auto; }
  .now { display: flex; align-items: center; gap: 24px; flex-wrap: wrap; }
  #state { font-size: 44px; font-weight: bold; min-width: 6em; }
  #state.exhale { color: var(--exhale); } #state.inhale { color: var(--inhale); } #state.idle { color: var(--idle); }
  #value { font-size: 44px; font-weight: bold; font-variant-numeric: tabular-nums; }
  #value small { font-size: 22px; color: var(--sub); }
  .legend { display: flex; gap: 18px; color: var(--sub); font-size: 16px; margin-left: auto; }
  .legend i { display: inline-block; width: 22px; height: 6px; border-radius: 3px; vertical-align: middle; margin-right: 6px; }
  .wrap { flex: 1; min-height: 320px; background: var(--panel); border-radius: 14px; position: relative; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
</style>
</head>
<body>
<header>
  <h1>呼吸の波<small>シン呼吸</small></h1>
  <div id="status">接続中…</div>
</header>
<div class="now">
  <div id="state" class="idle">待機中</div>
  <div id="value">0<small> Pa</small></div>
  <div class="legend">
    <span><i style="background:var(--exhale)"></i>吐いている</span>
    <span><i style="background:var(--inhale)"></i>吸っている</span>
    <span><i style="background:var(--idle)"></i>何もしていない</span>
  </div>
</div>
<div class="wrap"><canvas id="c"></canvas></div>
<script>
const WINDOW_SEC = 30; // 表示する長さ（秒）
// 判定のライン（app/server/breath.py と同じ値）
const LINES = [
  { v: 20, label: "吐き始め 20Pa", color: "#5cc2b3" },
  { v: 6, label: "吐き終わり 6Pa", color: "#3d8f85", right: true },
  { v: -25, label: "吸い始め −25Pa", color: "#6cb6ff" },
];
const STATE_JA = { exhale: "吐いている", inhale: "吸っている", idle: "何もしていない" };
const COLORS = { exhale: "#5cc2b3", inhale: "#6cb6ff", idle: "#7d86a8" };
const $ = (id) => document.getElementById(id);
const canvas = $("c");
const ctx = canvas.getContext("2d");
let points = []; // { t: 受け取った時刻（秒）, d: 変化（Pa）, s: 状態 }
let yMax = 80;

function resize() {
  const r = canvas.getBoundingClientRect();
  canvas.width = r.width * devicePixelRatio;
  canvas.height = r.height * devicePixelRatio;
  ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
}
addEventListener("resize", resize);
resize();

function connect() {
  const ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onopen = () => ($("status").textContent = "受信中");
  ws.onclose = () => { $("status").textContent = "サーバーにつながっていません（再接続中…）"; setTimeout(connect, 2000); };
  ws.onmessage = (e) => {
    const m = JSON.parse(e.data);
    if (m.type !== "breath") return;
    points.push({ t: performance.now() / 1000, d: m.delta, s: m.state });
    $("state").textContent = STATE_JA[m.state] || m.state;
    $("state").className = m.state;
    $("value").innerHTML = `${m.delta > 0 ? "+" : ""}${Math.round(m.delta)}<small> Pa</small>`;
  };
}
connect();

function draw() {
  const W = canvas.clientWidth, H = canvas.clientHeight;
  const padL = 64, padR = 16, padT = 16, padB = 28;
  const now = performance.now() / 1000;
  points = points.filter((p) => now - p.t <= WINDOW_SEC + 1);
  // 縦の目盛りは値に合わせて自動で調整（急に変わらないようにゆっくり）
  const peak = Math.max(60, ...points.map((p) => Math.abs(p.d) * 1.15));
  yMax += (peak - yMax) * 0.08;
  const yMin = -Math.max(40, yMax * 0.5);
  const x = (t) => padL + (W - padL - padR) * (1 - (now - t) / WINDOW_SEC);
  const y = (v) => padT + (H - padT - padB) * (yMax - v) / (yMax - yMin);

  ctx.clearRect(0, 0, W, H);
  ctx.font = "14px 'Noto Sans JP', system-ui, sans-serif";
  // 目盛り
  ctx.fillStyle = "#b9c3e6";
  ctx.textAlign = "right";
  ctx.textBaseline = "middle";
  const step = yMax > 200 ? 100 : yMax > 100 ? 50 : 20;
  for (let v = Math.ceil(yMin / step) * step; v <= yMax; v += step) {
    ctx.strokeStyle = v === 0 ? "#5a6390" : "#232c55";
    ctx.lineWidth = v === 0 ? 2 : 1;
    ctx.beginPath(); ctx.moveTo(padL, y(v)); ctx.lineTo(W - padR, y(v)); ctx.stroke();
    ctx.fillText(`${v}`, padL - 10, y(v));
  }
  // 時間の目盛り
  ctx.textAlign = "center";
  ctx.textBaseline = "top";
  for (let s = 0; s <= WINDOW_SEC; s += 5) ctx.fillText(s === 0 ? "いま" : `${s}秒前`, x(now - s), H - padB + 6);
  // 判定のライン
  ctx.setLineDash([6, 6]);
  ctx.textAlign = "left";
  ctx.textBaseline = "bottom";
  for (const l of LINES) {
    if (l.v > yMax || l.v < yMin) continue;
    ctx.strokeStyle = l.color; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(padL, y(l.v)); ctx.lineTo(W - padR, y(l.v)); ctx.stroke();
    ctx.fillStyle = l.color;
    ctx.textAlign = l.right ? "right" : "left"; // 近いラインの文字が重ならないように左右に分ける
    ctx.textBaseline = l.right ? "top" : "bottom";
    ctx.fillText(l.label, l.right ? W - padR - 8 : padL + 8, l.right ? y(l.v) + 3 : y(l.v) - 3);
  }
  ctx.setLineDash([]);
  // 波：吐いている間は下を塗りつぶし、線は状態ごとの色
  for (let i = 1; i < points.length; i++) {
    const a = points[i - 1], b = points[i];
    if (b.s === "exhale") {
      ctx.fillStyle = "rgba(92, 194, 179, 0.18)";
      ctx.beginPath(); ctx.moveTo(x(a.t), y(0)); ctx.lineTo(x(a.t), y(a.d)); ctx.lineTo(x(b.t), y(b.d)); ctx.lineTo(x(b.t), y(0)); ctx.fill();
    }
    ctx.strokeStyle = COLORS[b.s] || "#ffffff";
    ctx.lineWidth = 4;
    ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(x(a.t), y(a.d)); ctx.lineTo(x(b.t), y(b.d)); ctx.stroke();
  }
  // いまの値の点
  const last = points[points.length - 1];
  if (last) {
    ctx.fillStyle = COLORS[last.s] || "#fff";
    ctx.beginPath(); ctx.arc(x(last.t), y(last.d), 7, 0, Math.PI * 2); ctx.fill();
  }
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
</script>
</body>
</html>
