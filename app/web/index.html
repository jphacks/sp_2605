<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>エア・オカリナ</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <span class="brand">エア・オカリナ</span>
  <span id="sensor" class="pill">センサー確認中…</span>
</header>

<main>
  <!-- ホーム -->
  <section id="home" class="screen active">
    <h1>吹くと、曲が進む。<br>呼吸が、ととのう。</h1>
    <p class="lead">ストローからゆっくり息を吐くと、1フレーズずつ曲が流れます。</p>
    <div id="songs" class="songs"></div>
    <p class="hint breathe-hint">ストローを軽く吹いてはじめよう</p>
    <button id="startBtn" class="primary">はじめる</button>
    <button id="homeRecordsBtn" class="ghost">記録を見る</button>
  </section>

  <!-- 演奏 -->
  <section id="play" class="screen">
    <div class="play-head">
      <span id="songTitle"></span>
      <div id="phraseDots" class="dots"></div>
    </div>
    <p id="prompt" class="prompt">まず、ゆっくり吸って…</p>
    <div id="noteRow" class="note-row"></div>
    <div class="flute">
      <div class="mouth"></div>
      <div id="holes" class="holes">
        <span data-i="0"></span><span data-i="1"></span><span data-i="2"></span><span data-i="3"></span>
      </div>
    </div>
    <div class="meter"><div id="meterFill"></div></div>
    <div class="play-foot">
      <label><input type="checkbox" id="followBreath" checked> 息の強さで音量を変える</label>
      <button id="quitBtn" class="ghost">やめる</button>
    </div>
  </section>

  <!-- 結果：ふりかえり。課題①「正しくできているかわからない」②「続かない」に答える要素だけを並べる -->
  <section id="result" class="screen">
    <p class="tag">ふりかえり</p>
    <h2 id="resultHeadline" class="headline"></h2>
    <p id="resultSub" class="lead"></p>

    <figure class="wave-card reveal">
      <figcaption>あなたの呼吸の波</figcaption>
      <svg id="wave" viewBox="0 0 600 160" preserveAspectRatio="none" role="img" aria-label="1曲分の息の強さの波"></svg>
      <div class="wave-axis"><span>はじめ</span><span>おわり</span></div>
    </figure>

    <div id="judges" class="judges"></div>
    <p class="note criteria-note">判定の基準は仮のものです（チームで調整中）</p>

    <div id="tip" class="tip reveal"></div>
    <div id="badges" class="badges"></div>

    <details class="details">
      <summary>くわしいデータ（フレーズごと）</summary>
      <div class="charts">
        <div id="cPhraseLen"></div>
        <div id="cPhraseStab"></div>
      </div>
    </details>

    <div class="actions">
      <button id="againBtn" class="primary">もう1曲</button>
      <button id="recordsBtn" class="ghost">記録を見る</button>
      <button id="homeBtn" class="ghost">ホームへ</button>
    </div>
  </section>

  <!-- 記録 -->
  <section id="records" class="screen">
    <h2>記録</h2>
    <h3 class="section-title">これまでの演奏</h3>
    <p id="noSessions" class="lead">まだ記録がありません。1曲吹くとここに並びます。</p>
    <div class="charts">
      <div id="cSessLen"></div>
      <div id="cSessStab"></div>
    </div>
    <h3 class="section-title">日ごとの推移</h3>
    <p class="note"><span class="swatch sample"></span>灰色の点線は<b>サンプルデータ</b>（続けた場合のイメージ）、<span class="swatch real"></span>緑が実際の記録です。</p>
    <div class="charts">
      <div id="cDayLen"></div>
      <div id="cDayStab"></div>
    </div>
    <div class="actions">
      <button id="recordsHomeBtn" class="primary">ホームへ</button>
    </div>
  </section>
</main>

<footer class="devbar">開いたら画面を1回クリック（音を有効にするため）／ 開発用：スペースキー長押し＝吐く ／ 1〜4キー＝指穴</footer>
<script type="module" src="app.js"></script>
</body>
</html>
